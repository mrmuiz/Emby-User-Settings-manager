name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.1.3-beta)
        required: true
        default: v0.1.3-beta
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build -c Release
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" bin/Release/netstandard2.0/EmbyUserSettingsManager.dll \
            --target "$GITHUB_SHA" --prerelease --title "$TAG" \
            --notes "Install: copy EmbyUserSettingsManager.dll to the Emby plugins folder and restart Emby. Test on a single user first."
