<div data-role="page" class="page type-interior pluginConfigurationPage EmbyUserSettingsManagerPage" data-require="emby-button,emby-select,emby-checkbox" data-controller="__plugin/EmbyUserSettingsManager.js">
    <style>
        .eus-wrap { max-width: 1050px; margin: 0 auto; padding: 1em; }
        .eus-panel { padding: 1em; margin: 0 0 1em; border-radius: 8px; background: rgba(128,128,128,.09); }
        .eus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1em; }
        .eus-setting { display: flex; align-items: center; gap: .7em; margin: .75em 0; }
        .eus-setting label { flex: 1; }
        .eus-select { min-width: 130px; }
        .eus-text { padding: .4em .6em; border-radius: 4px; border: 1px solid rgba(128,128,128,.5); background: transparent; color: inherit; font: inherit; box-sizing: border-box; }
        .eus-setting .eus-text, .eus-setting .eus-select { flex: 0 1 280px; width: 280px; min-width: 0; }
        .eus-stack { display: grid; gap: 1em; grid-template-columns: minmax(0, 1fr); }
        .eus-setting.eus-missing { opacity: .5; }
        .eus-views { flex: 0 1 280px; width: 280px; }
        .eus-views div { display: flex; align-items: center; gap: .3em; padding: .2em 0; border-bottom: 1px solid rgba(128,128,128,.2); }
        .eus-views select { flex: 1; min-width: 0; }
        .eus-views span { flex: 1; overflow-wrap: anywhere; }
        .eus-views button { background: transparent; border: 1px solid rgba(128,128,128,.5); color: inherit; border-radius: 4px; cursor: pointer; padding: .1em .5em; }
        details.eus-panel > summary { cursor: pointer; font-size: 1.5em; font-weight: 500; margin-bottom: .5em; }
        .eus-libs { max-height: 220px; overflow-y: auto; }
        .eus-libs .eus-lib { display: flex; align-items: center; gap: .5em; padding: .2em 0; }
        .eus-diag { width: 100%; min-height: 8em; box-sizing: border-box; font-family: monospace; font-size: .8em; }
        .eus-header { display: flex; align-items: center; gap: .8em; }
        .eus-header h1 { margin: .4em 0; }
        .eus-lang { margin-left: auto; position: relative; }
        .eus-lang-btn { display: inline-flex; align-items: center; gap: .5em; padding: .4em .7em; border-radius: 6px; border: 1px solid rgba(128,128,128,.5); background: transparent; color: inherit; font: inherit; cursor: pointer; }
        .eus-lang-btn svg.eus-flag, .eus-lang-item svg.eus-flag { width: 22px; height: 15px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(128,128,128,.35); flex: none; }
        .eus-lang-btn svg.eus-globe, .eus-lang-item svg.eus-globe { width: 20px; height: 20px; flex: none; }
        .eus-lang-menu { display: none; position: absolute; right: 0; top: calc(100% + 4px); min-width: 12em; z-index: 50; padding: .3em; border-radius: 8px; border: 1px solid rgba(128,128,128,.5); background: #2b2b2b; color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
        .eus-lang-menu.eus-open { display: block; }
        .eus-lang-item { display: flex; align-items: center; gap: .6em; width: 100%; padding: .5em .7em; border: 0; border-radius: 6px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
        .eus-lang-item:hover, .eus-lang-item.eus-sel { background: rgba(255,255,255,.14); }
        .eus-langsel { margin-left: auto; width: auto; min-width: 9em; padding: .35em .6em; border-radius: 6px; background: transparent; color: inherit; border: 1px solid rgba(128,128,128,.5); }
        .eus-langsel option { color: #000; }
        .eus-badge { font-size: .8em; padding: .15em .6em; border-radius: 1em; border: 1px solid rgba(128,128,128,.5); opacity: .8; white-space: nowrap; }
        .eus-logo { width: 56px; height: 56px; border-radius: 12px; flex: none; }
        .eus-users { max-height: 320px; overflow-y: auto; padding: .5em; border: 1px solid rgba(128,128,128,.35); border-radius: 6px; }
        .eus-user { display: flex; gap: .6em; align-items: center; padding: .35em .2em; }
        .eus-actions { display: flex; flex-wrap: wrap; gap: .6em; margin-top: 1em; }
        .eus-results { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; overflow-y: auto; }
        .eus-note { opacity: .8; font-size: .92em; }
        .eus-status { margin-top: .8em; white-space: pre-wrap; }
        .eus-ok { color: #2e9d50; }
        .eus-error { color: #d9534f; }
        /* Keep controls usable in narrow embedded/mobile WebViews. */
        .eus-wrap, .eus-panel, .eus-grid, .eus-setting { min-width: 0; box-sizing: border-box; }
        .eus-setting { flex-wrap: wrap; }
        .eus-setting label { min-width: 0; }
        .eus-select { max-width: 100%; }
        .eus-users { overflow-x: hidden; }
        .eus-user span { overflow-wrap: anywhere; }
        .eus-actions button { max-width: 100%; white-space: normal; }
        @media (max-width: 600px) {
            .eus-setting .eus-text, .eus-setting .eus-select, .eus-views { flex: 1 1 100%; width: 100%; }
            .eus-wrap { padding: .5em; }
            .eus-panel { padding: .75em; }
            .eus-grid { grid-template-columns: minmax(0, 1fr); gap: .5em; }
            .eus-setting { align-items: flex-start; }
            .eus-setting label { flex: 1 1 65%; }
            .eus-setting .eus-select { flex: 1 1 100%; width: 100%; min-width: 0; }
            .eus-actions { gap: .4em; }
            .eus-actions button { flex: 1 1 auto; }
            .eus-results { max-height: 45vh; }
        }
        .eus-row { display: flex; flex-wrap: wrap; gap: .6em; align-items: center; margin: .6em 0; }
        .eus-row .eus-text, .eus-row .eus-select { flex: 1 1 200px; min-width: 0; }
        .eus-extra { margin-top: .6em; }
        .eus-extra label { overflow-wrap: anywhere; }
        .eus-tag { font-size: .75em; opacity: .65; margin-left: .4em; }
        .eus-warn { color: #d9a441; }
</style>

            <div class="eus-panel">
                <h2 data-i18n="presets">Presets</h2>
                <div class="eus-row">
                    <select is="emby-select" id="eus-preset" class="eus-select"></select>
                    <button is="emby-button" type="button" id="eus-preset-delete" class="raised"><span data-i18n="deletePreset">Delete preset</span></button>
                </div>
                <div class="eus-row">
                    <input type="text" id="eus-preset-name" class="eus-text" data-i18n-placeholder="presetName" />
                    <button is="emby-button" type="button" id="eus-preset-save" class="raised"><span data-i18n="savePreset">Save preset</span></button>
                </div>
                <h3 data-i18n="loadFromUser">Copy settings from a user</h3>
                <p class="eus-note" data-i18n="loadFromUserNote"></p>
                <div class="eus-row">
                    <select is="emby-select" id="eus-source-user" class="eus-select"></select>
                    <button is="emby-button" type="button" id="eus-load-user" class="raised"><span data-i18n="loadSettings">Load settings</span></button>
                </div>
                <div class="eus-row">
                    <button is="emby-button" type="button" id="eus-diag" class="raised"><span data-i18n="diag">Copy detected keys (diagnostics)</span></button>
                </div>
                <textarea id="eus-diag-out" class="eus-diag" style="display:none" readonly></textarea>
                <p id="eus-load-status" class="eus-note"></p>
            </div>

            <div class="eus-panel">
                <h2 data-i18n="targetGroup">Target users</h2>
                <div class="eus-actions">
                    <button is="emby-button" type="button" id="eus-reload" class="raised"><span data-i18n="reloadUsers">Reload users</span></button>
                    <button is="emby-button" type="button" id="eus-select-all" class="raised"><span data-i18n="selectAll">Select all</span></button>
                    <button is="emby-button" type="button" id="eus-select-none" class="raised"><span data-i18n="selectNone">Select none</span></button>
                </div>
                <p id="eus-count" class="eus-note"></p>
                <div id="eus-users" class="eus-users"><span data-i18n="loadingUsers">Loading users…</span></div>
            </div>

            <div id="eus-settings" class="eus-stack"></div>

            <details class="eus-panel" id="eus-more">
                <summary data-i18n="otherSettings">Other settings</summary>
                <p class="eus-note" data-i18n="otherNote"></p>
                <div class="eus-row" id="eus-filter-row">
                    <input type="text" id="eus-filter" class="eus-text" data-i18n-placeholder="filter" />
                </div>
                <div id="eus-extra" class="eus-extra"></div>
            </details>

            <div class="eus-panel">
                <h2 data-i18n="apply">Apply</h2>
                <div class="eus-actions"><button is="emby-button" type="button" id="eus-apply" class="raised button-submit"><span data-i18n="applyToUsers">Apply to selected users</span></button></div>
                <div id="eus-status" class="eus-status" role="status"></div>
                <pre id="eus-results" class="eus-results"></pre>
            </div>
